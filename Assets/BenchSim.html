<!-- bench.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bench Press Biomechanics Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { display: flex; }
    .control-panel { width: 300px; padding: 20px; border-right: 1px solid #ccc; }
    .visualization { flex-grow: 1; padding: 20px; }
    label { font-weight: bold; }
    input, select, button { width: 100%; margin-top: 5px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>Bench Press Biomechanics Simulator</h1>
  <div class="container">
    <div class="control-panel">
      <label for="neuralActivation">Neural Activation:</label>
      <select id="neuralActivation">
        <option value="0.6">Beginner</option>
        <option value="0.8">Intermediate</option>
        <option value="1.0">Elite</option>
      </select>
      <label for="muscleFiber">Muscle Fiber Type (% Type II):</label>
      <input type="range" id="muscleFiber" min="0" max="100" value="50"><span id="muscleFiberValue">50</span>%
      <label for="pennationAngle">Pennation Angle (°):</label>
      <input type="range" id="pennationAngle" min="0" max="30" value="15"><span id="pennationAngleValue">15</span>°
      <label for="leverArmLength">Lever Arm Length (cm):</label>
      <input type="number" id="leverArmLength" value="30">
      <label for="muscleInsertion">Muscle Insertion (cm):</label>
      <input type="range" id="muscleInsertion" min="0" max="10" value="4" step="0.1"><span id="muscleInsertionValue">4</span> cm
      <button onclick="simulate()">Simulate</button>
    </div>
    <div class="visualization">
      <canvas id="diagramCanvas" width="400" height="300" style="border:1px solid #ccc;"></canvas>
      <canvas id="forceGraph"></canvas>
    </div>
  </div>

  <script>
    const fiber = document.getElementById('muscleFiber');
    const fiberVal = document.getElementById('muscleFiberValue');
    const penAngle = document.getElementById('pennationAngle');
    const penVal = document.getElementById('pennationAngleValue');
    const insert = document.getElementById('muscleInsertion');
    const insertVal = document.getElementById('muscleInsertionValue');

    fiber.oninput = () => fiberVal.textContent = fiber.value;
    penAngle.oninput = () => penVal.textContent = penAngle.value;
    insert.oninput = () => insertVal.textContent = insert.value;

    function simulate() {
      const activation = parseFloat(document.getElementById('neuralActivation').value);
      const fiberType = parseFloat(fiber.value) / 100;
      const angle = parseFloat(penAngle.value);
      const lever = parseFloat(document.getElementById('leverArmLength').value);
      const insertion = parseFloat(insert.value);

      const pennationEffect = Math.cos(angle * Math.PI / 180);
      const baseForce = 800;
      const effectiveArm = lever + insertion;

      const force = baseForce * activation * pennationEffect * (effectiveArm / lever);

      let jointAngles = [], forceValues = [];
      for (let i = 0; i <= 120; i += 10) {
        jointAngles.push(i);
        forceValues.push(force * (1 - i / 150));
      }

      const canvas = document.getElementById('diagramCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.arc(200, 150, 20, 0, 2 * Math.PI);
      ctx.stroke();

      const graph = document.getElementById('forceGraph').getContext('2d');
      new Chart(graph, {
        type: 'line',
        data: {
          labels: jointAngles,
          datasets: [{
            label: 'Force (N)',
            data: forceValues,
            borderColor: 'blue',
            fill: false
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: { title: { display: true, text: 'Joint Angle (°)' } },
            y: { title: { display: true, text: 'Force (N)' }, beginAtZero: true }
          }
        }
      });
    }
  </script>
</body>
</html>
